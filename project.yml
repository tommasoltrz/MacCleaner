name: Moppo

# The .xcodeproj is generated from this file — never hand-edited. Regenerate with:
#   xcodegen generate
options:
  bundleIdPrefix: com.tommasolaterza
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  MoppoCore:
    path: Core

targets:
  Moppo:
    type: application
    platform: macOS
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
        # PhotoKit terminates the process if the app fetches the photo library
        # without this description.
        NSPhotoLibraryUsageDescription: "Moppo reads your photo library to find duplicates. Nothing is deleted until you confirm it."
        # macOS protects another app's bundle and sandbox data separately. An
        # administrator retry cannot bypass either privacy decision.
        NSAppDataUsageDescription: "Moppo needs access to data from removed apps so it can move files that you select to the Trash."
        NSAppBundlesUsageDescription: "Moppo needs permission to move applications that you select to the Trash."
        NSServices:
          - NSMenuItem:
              default: "Review Uninstall with Moppo"
            NSMessage: reviewUninstall
            NSPortName: Moppo
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
            NSRestricted: true
            NSSendFileTypes:
              - com.apple.application-bundle
            NSServiceDescription: "Open the selected application in Moppo for uninstall review."
    sources:
      # Everything but the app icon, which is declared as a single file below:
      # `AppIcon.icon` is an Icon Composer bundle, and xcodegen would otherwise
      # walk into it and add its layer SVGs as loose resources. actool compiles
      # the bundle when it is one file reference.
      - path: App
        excludes:
          - "Resources/AppIcon.icon"
          - "Resources/AppIcon.icon/**"
      - path: App/Resources/AppIcon.icon
        type: file
    dependencies:
      - package: MoppoCore
        product: MoppoCore
    preBuildScripts:
      - name: Require signed build
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          if [ "${CODE_SIGNING_ALLOWED:-NO}" != "YES" ]; then
            echo "error: Moppo requires code signing because macOS ties privacy grants to its signed identity."
            exit 1
          fi
          case "${CODE_SIGN_IDENTITY:-}" in
            ""|"-")
              echo "error: Moppo requires an Apple Development signing identity."
              exit 1
              ;;
          esac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tommasolaterza.Moppo
        PRODUCT_NAME: Moppo
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete

        # Moppo must traverse the whole disk, read other volumes, and shell out
        # to diskutil. A sandboxed app cannot do any of that, and Full Disk Access is
        # granted to an unsandboxed bundle identity.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO

        # A real Apple Development identity: the signature's team+bundle identity
        # is stable across rebuilds, so TCC grants (Full Disk Access) finally
        # survive. Ad-hoc signing changed hash every build and macOS forgot the
        # grant each time.
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: L2P2KC4C69
        CODE_SIGN_STYLE: Manual

        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES

schemes:
  Moppo Onboarding:
    build:
      targets:
        Moppo: all
    run:
      config: Debug
      commandLineArguments:
        "--show-onboarding": true
  Moppo:
    build:
      targets:
        Moppo: all
    run:
      config: Debug
    archive:
      config: Release
