name: MacCleaner

# The .xcodeproj is generated from this file — never hand-edited. Regenerate with:
#   xcodegen generate
options:
  bundleIdPrefix: com.tommasolaterza
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  MacCleanerCore:
    path: Core

targets:
  MacCleaner:
    type: application
    platform: macOS
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
        # PhotoKit terminates the process if the app fetches the photo library
        # without this description.
        NSPhotoLibraryUsageDescription: "MacCleaner reads your photo library to find duplicates. Nothing is deleted until you confirm it."
        # macOS protects another app's bundle and sandbox data separately. An
        # administrator retry cannot bypass either privacy decision.
        NSAppDataUsageDescription: "MacCleaner needs access to data from removed apps so it can move files that you select to the Trash."
        NSAppBundlesUsageDescription: "MacCleaner needs permission to move applications that you select to the Trash."
    sources:
      - path: App
    dependencies:
      - package: MacCleanerCore
        product: MacCleanerCore
    preBuildScripts:
      - name: Require signed build
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          if [ "${CODE_SIGNING_ALLOWED:-NO}" != "YES" ]; then
            echo "error: MacCleaner requires code signing because macOS ties privacy grants to its signed identity."
            exit 1
          fi
          case "${CODE_SIGN_IDENTITY:-}" in
            ""|"-")
              echo "error: MacCleaner requires an Apple Development signing identity."
              exit 1
              ;;
          esac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tommasolaterza.MacCleaner
        PRODUCT_NAME: MacCleaner
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete

        # MacCleaner must traverse the whole disk, read other volumes, and shell out
        # to diskutil. A sandboxed app cannot do any of that, and Full Disk Access is
        # granted to an unsandboxed bundle identity.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO

        # A real Apple Development identity: the signature's team+bundle identity
        # is stable across rebuilds, so TCC grants (Full Disk Access) finally
        # survive. Ad-hoc signing changed hash every build and macOS forgot the
        # grant each time.
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: L2P2KC4C69
        CODE_SIGN_STYLE: Manual

        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES

schemes:
  MacCleaner:
    build:
      targets:
        MacCleaner: all
    run:
      config: Debug
    archive:
      config: Release
